<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loading Spinner</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000000;
        }


        /* =========================
           SPINNER
        ========================= */

        .spinner {
            /* Scales with the viewport: never smaller than 48px,
               never bigger than 120px, otherwise ~16% of the
               shorter viewport edge. */
            --size: clamp(48px, 16vmin, 120px);

            width: var(--size);
            height: var(--size);

            position: relative;
        }


        /* =========================
           EACH BAR
           (dimensions derived from --size, same ratios as the
           original fixed 120px / 12px / 35px / 10px / 60px values)
        ========================= */

        .spinner span {
            position: absolute;

            width: calc(var(--size) * 0.1);
            height: calc(var(--size) * 0.2917);

            background: #444444;

            border-radius: calc(var(--size) * 0.0833);

            left: 50%;
            top: 50%;

            transform-origin: 50% calc(var(--size) * 0.5);

            transform: translate(-50%, calc(var(--size) * -0.5));
        }


        /* =========================
           BAR POSITIONS
        ========================= */

        .spinner span:nth-child(1) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(0deg);
        }

        .spinner span:nth-child(2) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(30deg);
        }

        .spinner span:nth-child(3) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(60deg);
        }

        .spinner span:nth-child(4) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(90deg);
        }

        .spinner span:nth-child(5) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(120deg);
        }

        .spinner span:nth-child(6) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(150deg);
        }

        .spinner span:nth-child(7) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(180deg);
        }

        .spinner span:nth-child(8) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(210deg);
        }

        .spinner span:nth-child(9) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(240deg);
        }

        .spinner span:nth-child(10) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(270deg);
        }

        .spinner span:nth-child(11) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(300deg);
        }

        .spinner span:nth-child(12) {
            transform: translate(-50%, calc(var(--size) * -0.5)) rotate(330deg);
        }


        /* =========================
           ANIMATION
        ========================= */

        .spinner span {
            animation: loading 1.2s linear infinite;
        }


        /* =========================
           FADE ANIMATION
        ========================= */

        @keyframes loading {

            0% {
                opacity: 1;
            }

            8% {
                opacity: 1;
            }

            75% {
                opacity: 0.15;
            }

            100% {
                opacity: 0.15;
            }

        }


        /* =========================
           ANIMATION DELAY
        ========================= */

        .spinner span:nth-child(1) {
            animation-delay: 0s;
        }

        .spinner span:nth-child(2) {
            animation-delay: -0.1s;
        }

        .spinner span:nth-child(3) {
            animation-delay: -0.2s;
        }

        .spinner span:nth-child(4) {
            animation-delay: -0.3s;
        }

        .spinner span:nth-child(5) {
            animation-delay: -0.4s;
        }

        .spinner span:nth-child(6) {
            animation-delay: -0.5s;
        }

        .spinner span:nth-child(7) {
            animation-delay: -0.6s;
        }

        .spinner span:nth-child(8) {
            animation-delay: -0.7s;
        }

        .spinner span:nth-child(9) {
            animation-delay: -0.8s;
        }

        .spinner span:nth-child(10) {
            animation-delay: -0.9s;
        }

        .spinner span:nth-child(11) {
            animation-delay: -1s;
        }

        .spinner span:nth-child(12) {
            animation-delay: -1.1s;
        }


        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {
            .spinner span {
                animation: none;
                opacity: 0.6;
            }
        }

    </style>

</head>


<body>


    <!-- LOADING SPINNER -->

    <div class="spinner">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


</body>
</html>
